<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Projects | Usamah Moin Mohammed</title>
    <meta name="description" content="Selected projects by Usamah Moin Mohammed.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        --ink: #1e2429;
        --muted: #5a6872;
        --paper: #f5f1ea;
        --accent: #c45a1d;
        --accent-soft: #f0d7c6;
        --card: #ffffff;
        --rule: rgba(30, 36, 41, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(196, 90, 29, 0.08), transparent 60%),
          radial-gradient(circle at 20% 80%, rgba(30, 36, 41, 0.08), transparent 50%),
          var(--paper);
        font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
        line-height: 1.6;
      }

      header {
        padding: 64px 20px 30px;
      }

      .wrap {
        max-width: 1040px;
        margin: 0 auto;
      }

      h1 {
        font-family: "Fraunces", "Georgia", serif;
        font-weight: 700;
        font-size: clamp(2.2rem, 2.6vw + 1rem, 3.4rem);
        margin: 0 0 8px;
      }

      .subtitle {
        color: var(--muted);
        max-width: 540px;
        margin: 0;
      }

      .nav {
        margin-top: 18px;
        display: inline-flex;
        gap: 12px;
        align-items: center;
      }

      .nav a {
        text-decoration: none;
        color: var(--accent);
        font-weight: 600;
      }

      main {
        padding: 0 20px 70px;
      }

      .projects {
        margin-top: 24px;
        display: grid;
        gap: 18px;
      }

      .card {
        background: var(--card);
        border-radius: 18px;
        padding: 22px;
        border: 1px solid var(--rule);
        box-shadow: 0 18px 40px rgba(30, 36, 41, 0.08);
      }

      .card h2 {
        font-family: "Fraunces", "Georgia", serif;
        font-size: 1.3rem;
        margin: 0 0 6px;
      }

      .card p {
        margin: 0 0 10px;
        color: var(--muted);
      }

      .pill {
        display: inline-block;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--accent-soft);
        color: var(--ink);
        font-size: 0.85rem;
        font-weight: 600;
        letter-spacing: 0.02em;
        margin-bottom: 10px;
      }

      .card a {
        color: var(--accent);
        text-decoration: none;
        font-weight: 600;
      }

      footer {
        padding: 20px;
        color: var(--muted);
        text-align: center;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap">
        <h1>Projects</h1>
        <p class="subtitle">
          Selected work in AI research, enterprise automation, and performance-focused web engineering.
        </p>
        <div class="nav">
          <a href="index.html">Back to portfolio</a>
          <span>•</span>
          <a href="articles.html">Articles</a>
        </div>
      </div>
    </header>

    <main>
      <div class="wrap projects">
        <div class="card">
          <h2>Projects coming soon</h2>
          <p>New case studies and links will be added here.</p>
        </div>
      </div>
    </main>

    <footer>
      More detailed case studies available on request.
    </footer>
  </body>
</html>
